- baseInfo:
    api_name: 订单支付
    url: /coupApply/cms/orderPay
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 订单支付
      json:
        orderNumber: ''  # 运行时由 order_data fixture 注入
        userId: ''  # 运行时由 order_data fixture 注入
        timeStamp: ${timestamp()}
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'error_code': '0000', 'message': '订单支付成功' }