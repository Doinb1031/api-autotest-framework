- baseInfo:
    api_name: 提交订单
    url: /coupApply/cms/placeAnOrder
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 提交订单
      json:
        goods_id: ''  # 运行时由 product_goods_id fixture 注入
        number: 2
        propertyChildIds: '2:9'
        inviter_id: '127839112'
        price: '128'
        freight_insurance: '0.0'
        discount_code: '002399'
        consignee_info: {"name": "张三","phone": 13800000000,"address": "北京市海淀区西三环北路74号院4栋3单元1008"}
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'message': '提交订单成功' }
        - eq: {'error_code':'0000'}
        # 数据库层断言：下单后订单必须真实落库（mock 服务写入的 SQLite），三层断言齐活
        - db: SELECT order_number FROM orders WHERE status = '0' LIMIT 1
      extract:
        orderNumber: $.orderNumber
        userId: $.userId