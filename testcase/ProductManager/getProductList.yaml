- baseInfo:
    api_name: 商品列表
    url: /coupApply/cms/goodsList
    method: Get
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 获取商品列表
      params:
        msgType: getHandsetListOfCust
        page: 1
        size: 20
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'error_code': '0000' }
        - exists: { '$.goodsList[0]': true }
      extract_list:
#        token: '"token": "(.*?)"'
        goodsId: $.goodsList[*].goodsId