- baseInfo:
    api_name: 校验商品物流状态
    url: /coupApply/cms/checkLogisticsStatus
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 查询订单物流状态
      json:
        orderNumber: ${get_extract_data(orderNumber)}
        timeStamp: ${timestamp()}
      validation:
        - contains: { 'status': '0' }
    - case_name: 查询不存在订单的物流状态
      json:
        orderNumber: "123456789012345678901"
        timeStamp: ${timestamp()}
      validation:
        - contains: { 'status': '' }
