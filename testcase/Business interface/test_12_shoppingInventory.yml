- baseInfo:
    api_name: 校验商品库存
    url: /coupApply/cms/shoppingInventory
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 校验商品库存充足
      json:
        goodsId: ${get_extract_data(goodsIds,1)}
        count: "1"
        timeStamp: ${timestamp()}
      validation:
        - eq: { 'status': '0' }
    - case_name: 校验商品库存不足
      json:
        goodsId: ${get_extract_data(goodsIds,1)}
        count: "999999"
        timeStamp: ${timestamp()}
      validation:
        - eq: { 'status': '1' }
