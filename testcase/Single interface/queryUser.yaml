- baseInfo:
    api_name: 用户查询
    url: /dar/user/queryUser
    method: POST
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 有效查询用户
      # 种子用户ID：mock 无状态，对该 ID 的查询可重复执行（删除后仍可查到），
      # 属于环境种子数据依赖而非用例间依赖；指向真实服务时应改为 fixture 造数注入。
      data:
        user_id: 123839387391912
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'msg': '查询成功!', 'msg_code': 200 }
