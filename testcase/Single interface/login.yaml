- baseInfo:
    api_name: 用户登录
    url: /dar/user/login
    method: post
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 错误密码登录
      data:
        user_name: test01
        passwd: wrongpass123
      validation:
        - contains: { 'msg': '登录失败' }
    - case_name: 不存在的用户名登录
      data:
        user_name: nobody_user_2024
        passwd: admin123
      validation:
        - contains: { 'msg': '登录失败' }
    - case_name: 密码缺失·登录失败
      data:
        user_name: test01
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'msg': '参数错误', 'msg_code': -1 }
    - case_name: 用户名密码全空·登录失败
      data:
        user_name: ''
        passwd: ''
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'msg': '参数错误', 'msg_code': -1 }
