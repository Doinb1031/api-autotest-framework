- baseInfo:
    api_name: 修改用户
    url: /dar/user/updateUser
    method: POST
    header:
      Content-Type: application/x-www-form-urlencoded;charset=UTF-8
  testCase:
    - case_name: 正常修改用户信息
      # testadduser 是 mock 服务的种子用户（无状态 mock 只识别预置用户，不认运行期新增的用户，
      # 且新增接口不返回 user_id）。这是环境种子数据依赖，不是用例间依赖；
      # 指向真实服务时应改为 fixture 造数注入被修改的用户。
      data:
        username: testadduser
        password: tset6789#$123
        role_id: 89588181111112343
        dates: '2023-12-31'
        phone: 13800000000
      validation:
        - contains: { 'status_code': 200 }
        - eq: { 'msg': '更新成功', 'msg_code': 200 }
