type = allure

;token失效处理配置（两层机制：请求前检查有效期 + 请求后检测失效重试）
[TOKEN]
;token有效期（秒），用于请求前计算是否即将过期
expire_seconds = 3600
;提前刷新时间（秒），到期前多少秒触发自动刷新
refresh_advance_seconds = 300
;判定token失效的HTTP状态码（逗号分隔）
invalid_status_codes = 401,403
;判定token失效的业务错误码（逗号分隔）
invalid_error_codes = 401,403
;判定token失效的业务提示关键词（逗号分隔）
invalid_keywords = token失效,token过期,登录失效,登录过期,未登录,登录超时

;HTTP 客户端配置（单例 Session + 连接池 + 失败重试，见 common/httpclient.py）
[HTTP]
;单请求超时（秒），Session 不会自动加超时，由各调用方逐请求传递
timeout = 10
;连接错误最大重试次数（请求未发出即失败时重试，对 POST 安全）
max_retries = 3
;连接池大小
pool_maxsize = 20
;是否校验 TLS 证书（指向真实服务时应改为 true）
verify_ssl = false

;SQLite 数据库（mock 服务的业务数据落库，供 db 断言查库验证；相对路径基于仓库根目录）
[SQLITE]
db_path = mock/mock.db

