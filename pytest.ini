[pytest]
;默认收集目录
testpaths = ./testcase

;用例分级 marker（CI 按 -m smoke / -m regression 选层执行）：
;  smoke      —— 核心业务链路（商品→加购→下单→支付），分钟级，用于提交前快速验证
;  regression —— 全量回归（conftest.py 自动给所有用例打上，无需手动标记）
markers =
    smoke: 核心业务链路冒烟用例
    regression: 全量回归用例

filterwarnings =
    error
    ignore::UserWarning

python_files = test_*.py

python_classes = Test*

python_functions = test
